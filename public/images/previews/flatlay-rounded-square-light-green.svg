<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Flat-lay preview: Black tee with rounded-square mark in light-green on left chest -->
  <defs>
    <style>
      .flatlay-background { fill: #F5F5F5; }
      .tee { fill: #0A0A0A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" class="flatlay-background"/>
  
  <!-- Black tee (front-facing flat-lay) -->
  <g class="tee">
    
  <!-- Black tee body (simplified flat-lay) -->
  <rect x="250" y="150" width="300" height="500" rx="20" fill="#0A0A0A"/>
  
  <!-- Neckline -->
  <ellipse cx="400" cy="150" rx="60" ry="30" fill="#1A1A1A"/>
  
  <!-- Left sleeve (viewer's left) -->
  <rect x="120" y="200" width="130" height="180" rx="15" fill="#0A0A0A"/>
  
  <!-- Right sleeve (viewer's right) -->
  <rect x="550" y="200" width="130" height="180" rx="15" fill="#0A0A0A"/>
  
  <!-- Subtle seam lines for dimension -->
  <line x1="280" y1="200" x2="280" y2="600" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="520" y1="200" x2="520" y2="600" stroke="#1A1A1A" stroke-width="2"/>

  </g>
  
  <!-- Mark on left chest (wearer's left = right side facing tee) -->
  <g transform="translate(430, 260) scale(0.35)">
    <!-- Grok Bot mark: face layout computation (product ID: squircle) -->
  <!-- Recipe weight: 0.84 | App picker: rounded-square -->
  <g class="grok-bot-mark" data-product-id="squircle" data-picker-shape="rounded-square">
    <path class="grok-bot-mark__head" d="M 66.6705,29.2705 L 161.8705,29.2705 Q 199.2705,29.2705 199.2705,66.6705 L 199.2705,161.8705 Q 199.2705,199.2705 161.8705,199.2705 L 66.6705,199.2705 Q 29.2705,199.2705 29.2705,161.8705 L 29.2705,66.6705 Q 29.2705,29.2705 66.6705,29.2705 Z" fill="#4CAF50"/>
    <g class="grok-bot-mark__eyes">
      <ellipse cx="86.50" cy="75.00" rx="6.97" ry="13.02" fill="#0A0A0A" transform="rotate(-20 86.50 75.00)"/>
    <ellipse cx="129.50" cy="70.00" rx="6.97" ry="13.02" fill="#0A0A0A" transform="rotate(-20 129.50 70.00)"/>
    </g>
  </g>
  </g>
</svg>