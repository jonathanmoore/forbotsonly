<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Flat-lay preview: Black tee with cloud mark in red on left chest -->
  <defs>
    <style>
      .flatlay-background { fill: #F5F5F5; }
      .tee { fill: #0A0A0A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" class="flatlay-background"/>
  
  <!-- Black tee (front-facing flat-lay) -->
  <g class="tee">
    
  <!-- Black tee body (simplified flat-lay) -->
  <rect x="250" y="150" width="300" height="500" rx="20" fill="#0A0A0A"/>
  
  <!-- Neckline -->
  <ellipse cx="400" cy="150" rx="60" ry="30" fill="#1A1A1A"/>
  
  <!-- Left sleeve (viewer's left) -->
  <rect x="120" y="200" width="130" height="180" rx="15" fill="#0A0A0A"/>
  
  <!-- Right sleeve (viewer's right) -->
  <rect x="550" y="200" width="130" height="180" rx="15" fill="#0A0A0A"/>
  
  <!-- Subtle seam lines for dimension -->
  <line x1="280" y1="200" x2="280" y2="600" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="520" y1="200" x2="520" y2="600" stroke="#1A1A1A" stroke-width="2"/>

  </g>
  
  <!-- Mark on left chest (wearer's left = right side facing tee) -->
  <g transform="translate(430, 260) scale(0.35)">
    <!-- Grok Bot mark: face layout computation (product ID: cloud) -->
  <!-- Recipe weight: 1 | App picker: cloud -->
  <g class="grok-bot-mark" data-product-id="cloud" data-picker-shape="cloud">
    <path class="grok-bot-mark__head" d="M 59.2705,124.2705 C 49.2705,84.2705 79.2705,64.2705 104.2705,74.2705 C 119.2705,59.2705 149.2705,69.2705 159.2705,94.2705 C 174.2705,104.2705 174.2705,134.2705 154.2705,144.2705 C 144.2705,154.2705 104.2705,154.2705 84.2705,144.2705 C 64.2705,139.2705 59.2705,124.2705 59.2705,124.2705 Z" fill="#E63946"/>
    <g class="grok-bot-mark__eyes">
      <ellipse cx="81.50" cy="72.00" rx="6.00" ry="12.00" fill="#0A0A0A" transform="rotate(-20 81.50 72.00)"/>
    <ellipse cx="122.50" cy="68.00" rx="6.00" ry="12.00" fill="#0A0A0A" transform="rotate(-20 122.50 68.00)"/>
    </g>
  </g>
  </g>
</svg>