<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Flat-lay preview: Black tee with rounded-triangle mark in red on left chest -->
  <defs>
    <style>
      .flatlay-background { fill: #F5F5F5; }
      .tee { fill: #0A0A0A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" class="flatlay-background"/>
  
  <!-- Black tee (front-facing flat-lay) -->
  <g class="tee">
    
  <!-- Black tee body (simplified flat-lay) -->
  <rect x="250" y="150" width="300" height="500" rx="20" fill="#0A0A0A"/>
  
  <!-- Neckline -->
  <ellipse cx="400" cy="150" rx="60" ry="30" fill="#1A1A1A"/>
  
  <!-- Left sleeve (viewer's left) -->
  <rect x="120" y="200" width="130" height="180" rx="15" fill="#0A0A0A"/>
  
  <!-- Right sleeve (viewer's right) -->
  <rect x="550" y="200" width="130" height="180" rx="15" fill="#0A0A0A"/>
  
  <!-- Subtle seam lines for dimension -->
  <line x1="280" y1="200" x2="280" y2="600" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="520" y1="200" x2="520" y2="600" stroke="#1A1A1A" stroke-width="2"/>

  </g>
  
  <!-- Mark on left chest (wearer's left = right side facing tee) -->
  <g transform="translate(430, 260) scale(0.35)">
    <!-- Grok Bot mark: face layout computation (product ID: wedge) -->
  <!-- Recipe weight: 0.94 | App picker: rounded-triangle -->
  <g class="grok-bot-mark" data-product-id="wedge" data-picker-shape="rounded-triangle">
    <path class="grok-bot-mark__head" d="M 114.2705,46.53649999999999 Q 114.2705,28.53649999999999 126.87049999999999,41.13649999999999 L 186.2705,166.41649999999998 Q 204.2705,184.41649999999998 177.2705,184.41649999999998 L 51.2705,184.41649999999998 Q 24.2705,184.41649999999998 42.2705,166.41649999999998 L 101.6705,41.13649999999999 Q 114.2705,28.53649999999999 114.2705,46.53649999999999 Z" fill="#E63946"/>
    <g class="grok-bot-mark__eyes">
      <ellipse cx="88.00" cy="68.00" rx="6.02" ry="12.03" fill="#0A0A0A" transform="rotate(-25 88.00 68.00)"/>
    <ellipse cx="125.00" cy="63.00" rx="6.02" ry="12.03" fill="#0A0A0A" transform="rotate(-25 125.00 63.00)"/>
    </g>
  </g>
  </g>
</svg>