<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon background -->
  <path d="M 200 50 L 330 125 L 330 275 L 200 350 L 70 275 L 70 125 Z" fill="#FF6B35" stroke="none"/>
  
  <!-- Grok Bot face - simple geometric representation -->
  <!-- Left eye -->
  <circle cx="160" cy="180" r="20" fill="#000000"/>
  <circle cx="160" cy="180" r="8" fill="#FFFFFF"/>
  
  <!-- Right eye -->
  <circle cx="240" cy="180" r="20" fill="#000000"/>
  <circle cx="240" cy="180" r="8" fill="#FFFFFF"/>
  
  <!-- Mouth - friendly curve -->
  <path d="M 150 240 Q 200 270 250 240" stroke="#000000" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Antenna/detail on top -->
  <circle cx="200" cy="100" r="12" fill="#000000"/>
  <line x1="200" y1="100" x2="200" y2="80" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="70" r="8" fill="#FFFFFF"/>
</svg>
