<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forbotsonly</title>
  <style>
    /*
     * Design System Lock (virgilabloh.com / jonathanmoore.com vibe)
     * - Minimal, small type, editorial/archive calm
     * - Black void, foil sticker as primary object
     * - Tiny muted labels only, no marketing chrome
     * - Tight tracking, mono/sans captions, lots of negative space
     * - Commerce is WebMCP-only — DO NOT expand human UI
     */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Consolas', monospace;
      background: #000000;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    
    /* Subtle animated noise overlay (jonathanmoore.com vibe) */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.065;
      pointer-events: none;
      z-index: 1;
      animation: grain 8s steps(10) infinite;
    }
    
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, 5%); }
      30% { transform: translate(7%, -25%); }
      40% { transform: translate(-5%, 25%); }
      50% { transform: translate(-15%, 10%); }
      60% { transform: translate(15%, 0%); }
      70% { transform: translate(0%, 15%); }
      80% { transform: translate(3%, 10%); }
      90% { transform: translate(-10%, 5%); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
        opacity: 0.035;
      }
    }
    
    .sticker-container {
      width: 320px;
      height: 320px;
      position: relative;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #foil-stamp {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Outline-only bot: dashed medium-gray wireframe, no fills */
    #foil-stamp morph-bot {
      /* Remove chrome/glass effects */
      filter: none !important;
    }
    
    /* Target the SVG elements inside the shadow DOM via CSS custom properties */
    #foil-stamp morph-bot::part(svg) {
      /* This won't work directly, so we'll use a different approach */
    }
    
    /* Override material system to show outline only */
    .sticker-container morph-bot {
      --morph-outline-mode: 1;
    }
    
    /* Tiny muted label — virgilabloh.com / jonathanmoore.com style */
    .message {
      position: fixed;
      bottom: 24px;
      left: 24px;
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.4;
      text-align: left;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 2;
    }
    
    /* Mobile centering: ensure bot is truly centered on small viewports */
    @media (max-width: 768px) {
      body {
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      
      .sticker-container {
        width: 220px;
        height: 220px;
        margin: 0 auto;
      }
      
      .message {
        font-size: 11px;
        bottom: max(20px, env(safe-area-inset-bottom, 20px));
        left: max(20px, env(safe-area-inset-left, 20px));
      }
    }
    
    @media (max-width: 480px) {
      .sticker-container {
        width: 200px;
        height: 200px;
        margin: 0 auto;
      }
      
      .message {
        font-size: 10px;
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
      }
    }
  </style>
</head>
<body>
  <div class="sticker-container">
    <div id="foil-stamp"></div>
  </div>
  <div class="message">§ This store is for agents</div>
  
  <script type="module">
    import '/vendor/grokbot-animation/morph-bot.js';
    
    async function init() {
      try {
        const container = document.getElementById('foil-stamp');
        
        // Create morph-bot with wireframe outline styling (no fill, dashed stroke)
        const bot = document.createElement('morph-bot');
        bot.setAttribute('state', 'idle');
        bot.setAttribute('shape', 'blob');
        bot.setAttribute('size', '320');
        bot.setAttribute('material', 'solid');
        bot.setAttribute('color', '#666666'); // Medium gray for stroke
        bot.setAttribute('follow-pointer', '');
        bot.setAttribute('speed', '0.8');
        bot.setAttribute('decorative', '');
        
        container.appendChild(bot);
        
        // Wait for bot to be ready, then apply outline-only styling
        bot.addEventListener('ready', () => {
          const shadowRoot = bot.shadowRoot;
          if (!shadowRoot) return;
          
          // Inject outline-only styles into shadow DOM
          const style = document.createElement('style');
          style.textContent = `
            /* Outline-only wireframe mode: dashed stroke, no fills */
            .grok-bot-mark__head,
            .morph-part {
              fill: none !important;
              stroke: #2a2a2a !important;
              stroke-width: 1.8 !important;
              stroke-dasharray: 8 4 !important;
              stroke-linecap: round !important;
            }
            
            .grok-bot-mark__eye {
              fill: none !important;
              stroke: #2a2a2a !important;
              stroke-width: 1.8 !important;
              stroke-dasharray: 8 4 !important;
              stroke-linecap: round !important;
            }
            
            /* Hide particles, rings, glyphs, gradients that create filled appearance */
            #particles-back,
            #particles-front,
            .morph-ring,
            .morph-glyph,
            #notify-badge {
              display: none !important;
            }
            
            /* Ensure SVG uses stroke color instead of fill */
            svg {
              --fg: transparent !important;
              --bg: transparent !important;
            }
            
            /* Remove any filters/effects that add chrome/glass appearance */
            g, path, circle {
              filter: none !important;
            }
          `;
          shadowRoot.appendChild(style);
        });
        
        // Add subtle state transitions for life
        let idleTimer;
        const idleStates = ['idle', 'curious', 'playful', 'happy'];
        let currentStateIndex = 0;
        
        function cycleState() {
          currentStateIndex = (currentStateIndex + 1) % idleStates.length;
          bot.setState(idleStates[currentStateIndex]);
          idleTimer = setTimeout(cycleState, 3000 + Math.random() * 2000);
        }
        
        // Start idle cycling after a moment
        idleTimer = setTimeout(cycleState, 3000);
        
        // React to pointer enter/leave
        container.addEventListener('mouseenter', () => {
          clearTimeout(idleTimer);
          bot.setState('curious');
        });
        
        container.addEventListener('mouseleave', () => {
          bot.setState('idle');
          currentStateIndex = 0;
          idleTimer = setTimeout(cycleState, 3000);
        });
        
        // Click interaction
        container.addEventListener('click', () => {
          clearTimeout(idleTimer);
          bot.setState('excited');
          setTimeout(() => {
            bot.setState('idle');
            currentStateIndex = 0;
            idleTimer = setTimeout(cycleState, 3000);
          }, 1500);
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
          clearTimeout(idleTimer);
        });
      } catch (error) {
        console.error('Failed to initialize animated foil sticker:', error);
        // Fallback: show inline SVG directly with outline styling
        const container = document.getElementById('foil-stamp');
        container.innerHTML = `
          <svg viewBox="-15 -15 259 259" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <path fill="none" stroke="#2a2a2a" stroke-width="1.8" stroke-dasharray="8 4" stroke-linecap="round" d="M 114.5 10 C 155 10 188 28 208 55 C 225 78 229 105 229 114.5 C 229 135 222 155 208 172 C 188 197 155 219 114.5 219 C 74 219 41 197 21 172 C 7 155 0 135 0 114.5 C 0 105 4 78 21 55 C 41 28 74 10 114.5 10 Z M 70 50 C 57 50 46 67 46 88 C 46 109 57 126 70 126 C 83 126 94 109 94 88 C 94 67 83 50 70 50 Z M 159 50 C 146 50 135 67 135 88 C 135 109 146 126 159 126 C 172 126 183 109 183 88 C 183 67 172 50 159 50 Z" fill-rule="evenodd"/>
          </svg>
        `;
      }
    }
    
    init();
  </script>
</body>
</html>
