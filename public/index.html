<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forbotsonly</title>
  <style>
    /*
     * Design System Lock (virgilabloh.com / jonathanmoore.com vibe)
     * - Minimal, small type, editorial/archive calm
     * - Black void, foil sticker as primary object
     * - Tiny muted labels only, no marketing chrome
     * - Tight tracking, mono/sans captions, lots of negative space
     * - Commerce is WebMCP-only — DO NOT expand human UI
     */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Consolas', monospace;
      background: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    
    .sticker-container {
      width: 320px;
      height: 320px;
      position: relative;
      cursor: pointer;
    }
    
    #foil-stamp {
      width: 100%;
      height: 100%;
      filter: contrast(1.15) brightness(1.05);
      mix-blend-mode: normal;
    }
    
    #foil-stamp morph-bot {
      filter: drop-shadow(0 8px 32px rgba(255, 255, 255, 0.15));
    }
    
    /* Tiny muted label — virgilabloh.com / jonathanmoore.com style */
    .message {
      position: fixed;
      bottom: 24px;
      left: 24px;
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.4;
      text-align: left;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    
    @media (max-width: 768px) {
      .sticker-container {
        width: 220px;
        height: 220px;
      }
      
      .message {
        font-size: 11px;
        bottom: 20px;
        left: 20px;
      }
    }
    
    @media (max-width: 480px) {
      .sticker-container {
        width: 200px;
        height: 200px;
      }
      
      .message {
        font-size: 10px;
        bottom: 16px;
        left: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="sticker-container">
    <div id="foil-stamp"></div>
  </div>
  <div class="message">§ This store is for agents</div>
  
  <script type="module">
    import '/vendor/grokbot-animation/morph-bot.js';
    
    async function init() {
      try {
        const container = document.getElementById('foil-stamp');
        
        // Create morph-bot with holographic prism material for chrome/foil effect
        const bot = document.createElement('morph-bot');
        bot.setAttribute('state', 'idle');
        bot.setAttribute('shape', 'blob');
        bot.setAttribute('size', '320');
        bot.setAttribute('material', 'rainbow-glass');
        bot.setAttribute('glass-preset', 'prism'); // Prism gives metallic chrome-like shimmer
        bot.setAttribute('follow-pointer', '');
        bot.setAttribute('speed', '0.8'); // Slightly slower for smoother foil-like motion
        bot.setAttribute('decorative', '');
        
        container.appendChild(bot);
        
        // Add subtle state transitions for life
        let idleTimer;
        const idleStates = ['idle', 'curious', 'playful', 'happy'];
        let currentStateIndex = 0;
        
        function cycleState() {
          currentStateIndex = (currentStateIndex + 1) % idleStates.length;
          bot.setState(idleStates[currentStateIndex]);
          idleTimer = setTimeout(cycleState, 3000 + Math.random() * 2000);
        }
        
        // Start idle cycling after a moment
        idleTimer = setTimeout(cycleState, 3000);
        
        // React to pointer enter/leave
        container.addEventListener('mouseenter', () => {
          clearTimeout(idleTimer);
          bot.setState('curious');
        });
        
        container.addEventListener('mouseleave', () => {
          bot.setState('idle');
          currentStateIndex = 0;
          idleTimer = setTimeout(cycleState, 3000);
        });
        
        // Click interaction
        container.addEventListener('click', () => {
          clearTimeout(idleTimer);
          bot.setState('excited');
          setTimeout(() => {
            bot.setState('idle');
            currentStateIndex = 0;
            idleTimer = setTimeout(cycleState, 3000);
          }, 1500);
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
          clearTimeout(idleTimer);
        });
      } catch (error) {
        console.error('Failed to initialize animated foil sticker:', error);
        // Fallback: show inline SVG directly
        const container = document.getElementById('foil-stamp');
        container.innerHTML = `
          <svg viewBox="-15 -15 259 259" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="foil-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
              </linearGradient>
            </defs>
            <path fill="url(#foil-gradient)" d="M 114.5 10 C 155 10 188 28 208 55 C 225 78 229 105 229 114.5 C 229 135 222 155 208 172 C 188 197 155 219 114.5 219 C 74 219 41 197 21 172 C 7 155 0 135 0 114.5 C 0 105 4 78 21 55 C 41 28 74 10 114.5 10 Z M 70 50 C 57 50 46 67 46 88 C 46 109 57 126 70 126 C 83 126 94 109 94 88 C 94 67 83 50 70 50 Z M 159 50 C 146 50 135 67 135 88 C 135 109 146 126 159 126 C 172 126 183 109 183 88 C 183 67 172 50 159 50 Z" fill-rule="evenodd"/>
          </svg>
        `;
      }
    }
    
    init();
  </script>
</body>
</html>
