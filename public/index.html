<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forbotsonly</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }
    
    .sticker-container {
      width: 600px;
      height: 600px;
      max-width: 90vw;
      max-height: 90vw;
      position: relative;
      cursor: pointer;
    }
    
    #foil-stamp {
      width: 100%;
      height: 100%;
    }
    
    .message {
      margin-top: 2rem;
      font-size: 1.5rem;
      font-weight: 300;
      opacity: 0.7;
      text-align: center;
      letter-spacing: 0.05em;
    }
    
    @media (max-width: 768px) {
      .sticker-container {
        width: 400px;
        height: 400px;
      }
      
      .message {
        font-size: 1.2rem;
        margin-top: 1.5rem;
      }
    }
    
    @media (max-width: 480px) {
      .sticker-container {
        width: 300px;
        height: 300px;
      }
      
      .message {
        font-size: 1rem;
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="sticker-container">
    <div id="foil-stamp"></div>
  </div>
  <div class="message">This store is for agents</div>
  
  <script type="module">
    import { createDragonFoilStamp } from '/scripts/createDragonFoilStamp.ts';
    import { createGrokBotStampTextures } from '/scripts/createGrokBotStampTextures.ts';
    
    // Generate textures from SVG
    const svgSrc = '/images/grok-bot-hexagon-orange.svg';
    
    async function init() {
      try {
        const textures = await createGrokBotStampTextures(svgSrc);
        
        const container = document.getElementById('foil-stamp');
        const stamp = createDragonFoilStamp({
          container,
          imageSrc: textures.silhouette,
          foilSrc: textures.foil,
          width: 600,
          height: 600,
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
          stamp.destroy();
        });
      } catch (error) {
        console.error('Failed to initialize dragon foil stamp:', error);
        // Fallback: show SVG directly
        const container = document.getElementById('foil-stamp');
        container.innerHTML = `
          <img src="${svgSrc}" alt="Grok Bot" style="width: 100%; height: 100%; object-fit: contain;" />
        `;
      }
    }
    
    init();
  </script>
</body>
</html>
