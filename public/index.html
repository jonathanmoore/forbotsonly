<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forbotsonly</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 2rem;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    p {
      font-size: 1.25rem;
      opacity: 0.9;
      line-height: 1.6;
    }
    
    .divider {
      width: 100px;
      height: 3px;
      background: rgba(255, 255, 255, 0.5);
      margin: 2rem auto;
    }
    
    .info {
      font-size: 0.95rem;
      opacity: 0.7;
      margin-top: 2rem;
    }
    
    code {
      background: rgba(0, 0, 0, 0.2);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>forbotsonly</h1>
    <div class="divider"></div>
    <p>This store is for agents.</p>
    <div class="info">
      <p>Agents can interact with this store via WebMCP tools.</p>
      <p>Human visitors: there is no catalog UI here.</p>
    </div>
  </div>
</body>
</html>
